spring:
  datasource:
    url: jdbc:h2:mem:medicare-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

medicare:
  security:
    jwt-secret: test-only-secret-with-at-least-32-random-characters
    token-ttl: PT2H
  cors:
    allowed-origins: http://localhost:3000