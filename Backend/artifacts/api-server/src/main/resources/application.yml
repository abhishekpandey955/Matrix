server:
  address: 0.0.0.0
  port: ${PORT:8080}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/api}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: medicare-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:medicare}}
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER:medicare}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:}}
  hikari:
    maximum-pool-size: ${DB_POOL_SIZE:5}
    minimum-idle: 1
    connection-timeout: 30000
    validation-timeout: 5000
    max-lifetime: 1200000
    idle-timeout: 300000
    keepalive-time: 300000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

medicare:
  security:
    jwt-secret: ${JWT_SECRET:${SESSION_SECRET:}}
    token-ttl: ${JWT_TTL:PT2H}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  admin-bootstrap:
    enabled: ${MEDICARE_ADMIN_BOOTSTRAP_ENABLED:${ADMIN_BOOTSTRAP_ENABLED:false}}
    email: ${MEDICARE_ADMIN_BOOTSTRAP_EMAIL:${ADMIN_BOOTSTRAP_EMAIL:}}
    password: ${MEDICARE_ADMIN_BOOTSTRAP_PASSWORD:${ADMIN_BOOTSTRAP_PASSWORD:}}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs